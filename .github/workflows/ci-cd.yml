name: MNIST CI/CD Pipeline

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r projects/mnist-pytorch/requirements.txt

    - name: Train smoke test
      run: |
        cd projects/mnist-pytorch
        python -m src.train --epochs 1 --device cpu --run-name ci

    - name: Run tests
      run: |
        cd projects/mnist-pytorch
        python -m unittest discover -s tests -v

    - name: Upload model artifact
      uses: actions/upload-artifact@v4
      with:
        name: mnist-model
        path: projects/mnist-pytorch/artifacts/best_model.pth