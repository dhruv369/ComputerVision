name: MNIST CI/CD Pipeline

on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r projects/mnist-keras/requirements.txt

    - name: Train model
      run: |
        cd projects/mnist-keras
        python train_ci.py

    - name: Run tests
      run: |
        cd projects/mnist-keras
        python test_model.py

    - name: Upload model artifact
      uses: actions/upload-artifact@v4
      with:
        name: mnist-model
        path: projects/mnist-keras/mnist/model_weights/mnist_model_*.pth